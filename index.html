<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta name="theme-color" content="#111827">
<title>Gozie AI</title>
<link rel="manifest" href="./manifest.json">
<link rel="icon" href="./icon.svg" type="image/svg+xml">
<style>
:root{--accent:#7c5cff;--bg:#0d1117;--panel:#151b25;--panel2:#1d2532;--text:#f3f4f6;--muted:#9ca3af;--border:#2c3544}
*{box-sizing:border-box}body{margin:0;height:100dvh;overflow:hidden;background:var(--bg);color:var(--text);font:15px system-ui,sans-serif}
button,input,textarea,select{font:inherit}button{cursor:pointer;color:var(--text);background:var(--panel2);border:1px solid var(--border);border-radius:10px;padding:10px}
.app{display:flex;height:100dvh}.sidebar{width:270px;flex-shrink:0;background:var(--panel);border-right:1px solid var(--border);display:flex;flex-direction:column;padding:14px;gap:12px}
.brand{display:flex;align-items:center;gap:10px;font-size:20px;font-weight:bold}.logo{background:var(--accent);color:white;border-radius:10px;padding:7px 12px}
.close-sidebar{display:none;margin-left:auto;border:0;background:transparent;font-size:26px;padding:3px 10px}.new-chat{width:100%;text-align:left;border-color:var(--accent)}
.section-label{color:var(--muted);font-size:12px;text-transform:uppercase}.history{flex:1;overflow-y:auto}.history button{width:100%;text-align:left;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;margin-bottom:4px}.history button.active{border-color:var(--accent)}
.settings{padding:18px 14px 14px;border:1px solid var(--border);border-radius:20px;background:var(--panel);display:grid;gap:8px}.settings label{display:block;color:var(--muted);font-size:12px;margin-bottom:6px}.settings select,.settings input{width:100%;margin-top:4px}.settings select{min-height:48px;padding:0 14px;border:1px solid var(--border);border-radius:14px;background:var(--panel2);color:var(--text);color-scheme:dark}.settings input[type=color]{height:52px;padding:5px;border:1px solid var(--border);border-radius:14px;background:var(--panel2)}
body.light{--bg:#f6f7fb;--panel:#fff;--panel2:#edf0f6;--text:#171923;--muted:#626b7b;--border:#dce1eb}body.light .settings select{color-scheme:light}
.main{flex:1;min-width:0;display:flex;flex-direction:column}.topbar{height:60px;flex-shrink:0;border-bottom:1px solid var(--border);display:flex;align-items:center;justify-content:space-between;padding:0 15px}.top-actions{display:flex;gap:8px}.menu-button{display:none}
.messages{flex:1;overflow-y:auto;padding:20px 14px}.thread{max-width:760px;margin:auto;display:flex;flex-direction:column;gap:18px}.welcome{text-align:center;margin:auto;padding:35px 10px}.welcome h1{font-size:clamp(27px,5vw,38px)}.welcome p,.footnote{color:var(--muted)}.suggestions{display:flex;flex-wrap:wrap;gap:8px;justify-content:center}
.message{padding:12px 15px;border:1px solid var(--border);background:var(--panel);border-radius:14px;white-space:pre-wrap;overflow-wrap:anywhere}.message.user{background:#292447;align-self:flex-end;max-width:90%}.message.assistant{align-self:flex-start;max-width:95%}
.composer-area{padding:12px}.composer{max-width:760px;margin:auto;display:flex;gap:8px;align-items:flex-end;background:var(--panel);border:1px solid var(--border);border-radius:15px;padding:10px}.composer textarea{flex:1;min-width:0;max-height:150px;resize:none;border:0;outline:0;background:transparent;color:var(--text);padding:8px}.send{background:var(--accent);color:white}.footnote{text-align:center;font-size:11px;margin-top:8px}

.auth-overlay{position:fixed;inset:0;z-index:100;display:none;align-items:center;justify-content:center;padding:18px;background:rgba(3,6,12,.72);backdrop-filter:blur(9px);-webkit-backdrop-filter:blur(9px)}
.auth-overlay.show{display:flex}.auth-card{position:relative;width:min(100%,430px);padding:30px;border:1px solid var(--border);border-radius:24px;background:var(--panel);box-shadow:0 24px 80px #0008;animation:authIn .18s ease-out}
@keyframes authIn{from{opacity:0;transform:translateY(8px) scale(.985)}to{opacity:1;transform:translateY(0) scale(1)}}
.auth-close{position:absolute;right:16px;top:14px;width:38px;height:38px;border:0;border-radius:50%;background:var(--panel2);font-size:23px}
.auth-brand{display:flex;align-items:center;gap:10px;margin-bottom:24px}.auth-brand .logo{font-size:20px;padding:9px 13px}.auth-card h2{font-size:27px;letter-spacing:-.6px;margin:0 0 7px}.auth-subtitle{color:var(--muted);margin:0 0 22px;line-height:1.5}
.auth-google{width:100%;display:flex;align-items:center;justify-content:center;gap:12px;background:#fff;color:#202124;border:1px solid #dadce0;border-radius:12px;padding:13px;font-weight:600}.google-g{font-size:21px;font-weight:800;color:#4285f4}
.auth-divider{display:flex;align-items:center;gap:12px;color:var(--muted);font-size:12px;margin:20px 0}.auth-divider:before,.auth-divider:after{content:"";height:1px;flex:1;background:var(--border)}
.auth-field{display:block;margin-bottom:14px}.auth-field span{display:block;font-size:13px;font-weight:600;margin-bottom:7px}.auth-field input{width:100%;padding:13px 14px;border:1px solid var(--border);border-radius:12px;background:var(--bg);color:var(--text);outline:none}.auth-field input:focus{border-color:var(--accent);box-shadow:0 0 0 3px color-mix(in srgb,var(--accent) 20%,transparent)}
.auth-submit{width:100%;padding:13px;background:var(--accent);color:white;border:0;border-radius:12px;font-weight:700;margin-top:4px}.auth-switch{text-align:center;color:var(--muted);font-size:13px;margin:19px 0 0}.auth-switch button{padding:0;border:0;background:none;color:var(--accent);font-weight:700}.auth-message{display:none;margin-top:14px;padding:11px 12px;border-radius:10px;background:var(--panel2);font-size:13px;line-height:1.45;overflow-wrap:anywhere}.auth-message.show{display:block}.auth-message.error{color:#ff9b9b}.auth-message.success{color:#8be0b1}.auth-legal{font-size:11px;color:var(--muted);text-align:center;margin-top:18px;line-height:1.5}
@media(max-width:480px){.auth-card{padding:25px 20px;border-radius:20px}.auth-card h2{font-size:25px}}
\n@media(max-width:700px){.sidebar{position:fixed;z-index:10;inset:0 auto 0 0;width:min(85vw,300px);height:100dvh;overflow-y:auto;transform:translateX(-105%);transition:transform .2s ease}.sidebar.open{transform:translateX(0);box-shadow:0 0 0 100vmax #0008}.close-sidebar{display:block}.menu-button{display:inline-block}.topbar{padding:0 10px}.welcome{padding:20px 3px}}
</style>
</head>
<body>
<div class="app">
<aside class="sidebar" id="sidebar">
  <div class="brand"><div class="logo">G</div><span>Gozie AI</span><button class="close-sidebar" id="closeSidebar" aria-label="Close sidebar" title="Close sidebar">×</button></div>
  <button class="new-chat" id="newChat">＋ New chat</button>
  <div class="section-label">Your conversations</div><div class="history" id="history"></div>
  <div class="settings">
    <div><label for="theme">Appearance</label><select id="theme"><option value="dark">Dark</option><option value="light">Light</option></select></div>
    <div><label for="accent">Accent colour</label><input id="accent" type="color" value="#7c5cff"></div>
    <button id="signIn">Sign in</button><button id="clearHistory">Clear chat history</button>
  </div>
</aside>
<main class="main">
<header class="topbar"><div style="display:flex;align-items:center;gap:10px"><button class="menu-button" id="menuButton">☰</button><strong id="chatTitle">New chat</strong></div><div class="top-actions"><button id="themeButton">◐</button><button id="aboutButton">About</button></div></header>
<section class="messages" id="messages"><div class="thread" id="thread"><div class="welcome"><h1>What can I help you with?</h1><p>Welcome to Gozie AI, your personal AI assistant.</p><div class="suggestions"><button>Explain something simply</button><button>Help me write</button><button>Brainstorm ideas</button></div></div></div></section>
<div class="composer-area"><form class="composer" id="composer"><textarea id="prompt" rows="1" placeholder="Message Gozie AI…" aria-label="Message Gozie AI"></textarea><button class="send" type="submit">↑ Send</button></form><div class="footnote" id="status">Preview mode · AI connection not yet configured</div></div>
</main></div>

<script>
const $=id=>document.getElementById(id);
let chats=[];
try{chats=JSON.parse(localStorage.getItem("gozie_chats_v1")||"[]");if(!Array.isArray(chats))chats=[]}catch{chats=[]}
let currentId=null;
function save(){try{localStorage.setItem("gozie_chats_v1",JSON.stringify(chats))}catch{}renderHistory()}
function currentChat(){return chats.find(chat=>chat.id===currentId)}
function closeSidebar(){$("sidebar").classList.remove("open")}
function newChat(){const chat={id:Date.now().toString()+Math.random().toString(16).slice(2),title:"New chat",messages:[],updated:Date.now()};chats.unshift(chat);currentId=chat.id;save();renderChat();closeSidebar();$("prompt").focus()}
function renderHistory(){const root=$("history");root.innerHTML="";[...chats].sort((a,b)=>b.updated-a.updated).forEach(chat=>{const button=document.createElement("button");button.textContent=chat.title||"New chat";button.className=chat.id===currentId?"active":"";button.onclick=()=>{currentId=chat.id;renderChat();closeSidebar()};root.appendChild(button)})}
function addMessage(role,content){const chat=currentChat();if(!chat)return;chat.messages.push({role,content});chat.updated=Date.now();if(chat.title==="New chat"&&role==="user")chat.title=content.slice(0,35)+(content.length>35?"…":"");save();renderChat()}
function renderChat(){const chat=currentChat(),thread=$("thread");$("chatTitle").textContent=chat?chat.title:"New chat";thread.innerHTML="";if(!chat||chat.messages.length===0){const welcome=document.createElement("div");welcome.className="welcome";const heading=document.createElement("h1");heading.textContent="What can I help you with?";const description=document.createElement("p");description.textContent="Welcome to Gozie AI, your personal AI assistant.";const suggestions=document.createElement("div");suggestions.className="suggestions";["Explain something simply","Help me write","Brainstorm ideas"].forEach(text=>{const button=document.createElement("button");button.textContent=text;button.onclick=()=>{$("prompt").value=text;$("prompt").focus()};suggestions.appendChild(button)});welcome.append(heading,description,suggestions);thread.appendChild(welcome)}else{chat.messages.forEach(message=>{const bubble=document.createElement("div");bubble.className="message "+(message.role==="user"?"user":"assistant");bubble.textContent=message.content;thread.appendChild(bubble)})}$("messages").scrollTop=$("messages").scrollHeight;renderHistory()}
$("menuButton").onclick=()=>$("sidebar").classList.toggle("open");$("closeSidebar").onclick=closeSidebar;$("newChat").onclick=newChat;
$("composer").addEventListener("submit",event=>{event.preventDefault();const text=$("prompt").value.trim();if(!text)return;if(!currentId)newChat();$("prompt").value="";addMessage("user",text);addMessage("assistant","Gozie AI is not connected to the real AI model yet. This is a preview. The next step is connecting your SmolLM3 service securely.");$("status").textContent="Preview mode · real AI connection is not configured"});
$("prompt").addEventListener("keydown",event=>{if(event.key==="Enter"&&!event.shiftKey){event.preventDefault();$("composer").requestSubmit()}});
$("prompt").addEventListener("input",()=>{const input=$("prompt");input.style.height="auto";input.style.height=Math.min(input.scrollHeight,150)+"px"});
function setTheme(theme){document.body.classList.toggle("light",theme==="light");$("theme").value=theme;localStorage.setItem("gozie_theme_v1",theme)}
$("theme").onchange=() =>setTheme($("theme").value);$("themeButton").onclick=()=>setTheme(document.body.classList.contains("light")?"dark":"light");
$("accent").oninput=()=>{document.documentElement.style.setProperty("--accent",$("accent").value);localStorage.setItem("gozie_accent_v1",$("accent").value)};
$("clearHistory").onclick=()=>{if(confirm("Delete all conversations saved on this device?")){chats=[];currentId=null;save();renderChat()}};
$("signIn").onclick=()=>window.gozieOpenAuth?.();
$("aboutButton").onclick=()=>alert("Gozie AI interface. Google and email sign-in are connected through Firebase when configured.");
setTheme(localStorage.getItem("gozie_theme_v1")||"dark");
const savedAccent=localStorage.getItem("gozie_accent_v1")||"#7c5cff";$("accent").value=savedAccent;document.documentElement.style.setProperty("--accent",savedAccent);
if(chats.length>0)currentId=chats[0].id;renderChat();
</script>

<script type="module">
import {initializeApp} from "https://www.gstatic.com/firebasejs/13.1.0/firebase-app.js";
import {getAuth,GoogleAuthProvider,signInWithPopup,createUserWithEmailAndPassword,signInWithEmailAndPassword,signOut,onAuthStateChanged} from "https://www.gstatic.com/firebasejs/13.1.0/firebase-auth.js";

const firebaseConfig={
  apiKey:"AIzaSyBlJI8E8OB4RiT0h8WuIcEFW0g0vpNWHKzY",
  authDomain:"gozie-ai2.firebaseapp.com",
  projectId:"gozie-ai2",
  storageBucket:"gozie-ai2.firebasestorage.app",
  messagingSenderId:"721332592612",
  appId:"1:721332592612:web:42ef393991bda492ffb1f1"
};
const app=initializeApp(firebaseConfig);
const auth=getAuth(app);
const googleProvider=new GoogleAuthProvider();
const $=id=>document.getElementById(id);
let creatingAccount=false;

function showAuthMessage(message,type="error"){
  const box=$("authMessage");
  box.textContent=message;
  box.className="auth-message show "+type;
}
function clearAuthMessage(){
  $("authMessage").textContent="";
  $("authMessage").className="auth-message";
}
function openAuth(){
  if(auth.currentUser){
    const shouldSignOut=confirm("You are signed in as "+(auth.currentUser.displayName||auth.currentUser.email)+".\n\nWould you like to sign out?");
    if(shouldSignOut)signOut(auth).catch(error=>alert("Could not sign out: "+error.message));
    return;
  }
  creatingAccount=false;
  updateAuthMode();
  clearAuthMessage();
  $("authOverlay").classList.add("show");
  document.body.style.overflow="hidden";
  setTimeout(()=>$("authEmail").focus(),80);
}
function closeAuth(){
  $("authOverlay").classList.remove("show");
  document.body.style.overflow="";
}
function updateAuthMode(){
  $("authTitle").textContent=creatingAccount?"Create your account":"Welcome back";
  $("authSubtitle").textContent=creatingAccount?"Create an account to get started with Gozie AI.":"Sign in to continue to your personal AI assistant.";
  $("authSubmit").textContent=creatingAccount?"Create account":"Sign in";
  $("authSwitchText").textContent=creatingAccount?"Already have an account?":"Don't have an account?";
  $("authSwitch").textContent=creatingAccount?"Sign in":"Create account";
  $("authPassword").autocomplete=creatingAccount?"new-password":"current-password";
}
function setBusy(busy){
  ["googleSignIn","authSubmit","authSwitch"].forEach(id=>$(id).disabled=busy);
  $("authSubmit").textContent=busy?"Please wait…":(creatingAccount?"Create account":"Sign in");
}
function friendlyError(error){
  const messages={
    "auth/invalid-email":"Please enter a valid email address.",
    "auth/user-not-found":"No account was found for that email. You can create an account instead.",
    "auth/wrong-password":"That password is incorrect. Please try again.",
    "auth/invalid-credential":"Your email or password is incorrect. Please check them and try again.",
    "auth/email-already-in-use":"An account with this email already exists. Try signing in instead.",
    "auth/weak-password":"Please use a password with at least 6 characters.",
    "auth/popup-closed-by-user":"The Google sign-in window was closed before completion.",
    "auth/popup-blocked":"Your browser blocked the Google sign-in window. Allow popups and try again.",
    "auth/unauthorized-domain":"This website domain is not authorized in Firebase. Add henrymeraldcompany-bit.github.io in Firebase Authentication settings.",
    "auth/network-request-failed":"Network error. Check your internet connection and try again."
  };
  return messages[error.code]||"Sign-in could not be completed. "+(error.message||"Please try again.");
}
window.gozieOpenAuth=openAuth;
$("signIn").onclick=openAuth;
$("authClose").onclick=closeAuth;
$("authOverlay").addEventListener("click",event=>{if(event.target===$("authOverlay"))closeAuth()});
document.addEventListener("keydown",event=>{if(event.key==="Escape")closeAuth()});
$("authSwitch").onclick=()=>{creatingAccount=!creatingAccount;clearAuthMessage();updateAuthMode()};
$("googleSignIn").onclick=async()=>{
  clearAuthMessage();setBusy(true);
  try{
    await signInWithPopup(auth,googleProvider);
    showAuthMessage("You’re signed in successfully. Welcome to Gozie AI!","success");
    setTimeout(closeAuth,900);
  }catch(error){console.error("Google sign-in error:",error);showAuthMessage(friendlyError(error))}
  finally{setBusy(false)}
};
$("authForm").addEventListener("submit",async event=>{
  event.preventDefault();clearAuthMessage();setBusy(true);
  const email=$("authEmail").value.trim();
  const password=$("authPassword").value;
  try{
    if(creatingAccount)await createUserWithEmailAndPassword(auth,email,password);
    else await signInWithEmailAndPassword(auth,email,password);
    showAuthMessage(creatingAccount?"Your account has been created successfully.":"You’re signed in successfully. Welcome back!","success");
    setTimeout(closeAuth,900);
  }catch(error){console.error("Email authentication error:",error);showAuthMessage(friendlyError(error))}
  finally{setBusy(false)}
});
onAuthStateChanged(auth,user=>{
  $("signIn").textContent=user?"Account · "+(user.displayName||user.email||"Signed in"):"Sign in";
  $("signIn").title=user?"Click to sign out":"Sign in to Gozie AI";
});
</script>

<script>
if("serviceWorker" in navigator){
  window.addEventListener("load",()=>{
    navigator.serviceWorker.register("./sw.js").catch(error=>console.error("Gozie AI service worker error:",error));
  });
}
</script>
</body>
</html>
