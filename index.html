
<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta name="theme-color" content="#111827">
<title>Gozie AI</title>

<style>

:root {
  --accent: #7c5cff;
  --bg: #0d1117;
  --panel: #151b25;
  --panel2: #1d2532;
  --text: #f3f4f6;
  --muted: #9ca3af;
  --border: #2c3544;
}

* { box-sizing: border-box; }

body {
  margin: 0;
  height: 100dvh;
  overflow: hidden;
  background: var(--bg);
  color: var(--text);
  font: 15px system-ui, sans-serif;
}

button, input, textarea, select {
  font: inherit;
}

button {
  cursor: pointer;
  color: var(--text);
  background: var(--panel2);
  border: 1px solid var(--border);
  border-radius: 10px;
  padding: 10px;
}

.app {
  display: flex;
  height: 100dvh;
}

.sidebar {
  width: 270px;
  flex-shrink: 0;
  background: var(--panel);
  border-right: 1px solid var(--border);
  display: flex;
  flex-direction: column;
  padding: 14px;
  gap: 12px;
}

.brand {
  display: flex;
  align-items: center;
  gap: 10px;
  font-size: 20px;
  font-weight: bold;
}

.logo {
  background: var(--accent);
  color: white;
  border-radius: 10px;
  padding: 7px 12px;
}

.close-sidebar {
  display: none;
  margin-left: auto;
  border: none;
  background: transparent;
  font-size: 26px;
  padding: 3px 10px;
}

.new-chat {
  width: 100%;
  text-align: left;
  border-color: var(--accent);
}

.section-label {
  color: var(--muted);
  font-size: 12px;
  text-transform: uppercase;
}

.history {
  flex: 1;
  overflow-y: auto;
}

.history button {
  width: 100%;
  text-align: left;
  overflow: hidden;
  text-overflow: ellipsis;
  white-space: nowrap;
  margin-bottom: 4px;
}

.history button.active {
  border-color: var(--accent);
}

.settings {
  border-top: 1px solid var(--border);
  padding-top: 12px;
  display: grid;
  gap: 8px;
  border-radius: 12px;
}

.settings label {
  display: block;
  color: var(--muted);
  font-size: 12px;
  border-radius: 12px;
}

.settings select,
.settings input {
  width: 100%;
  margin-top: 4px;
}

.main {
  flex: 1;
  min-width: 0;
  display: flex;
  flex-direction: column;
}

.topbar {
  height: 60px;
  flex-shrink: 0;
  border-bottom: 1px solid var(--border);
  display: flex;
  align-items: center;
  justify-content: space-between;
  padding: 0 15px;
}

.top-actions {
  display: flex;
  gap: 8px;
}

.menu-button {
  display: none;
}

.messages {
  flex: 1;
  overflow-y: auto;
  padding: 20px 14px;
}

.thread {
  max-width: 760px;
  margin: auto;
  display: flex;
  flex-direction: column;
  gap: 18px;
}

.welcome {
  text-align: center;
  margin: auto;
  padding: 35px 10px;
}

.welcome h1 {
  font-size: clamp(27px, 5vw, 38px);
}

.welcome p,
.footnote {
  color: var(--muted);
}

.suggestions {
  display: flex;
  flex-wrap: wrap;
  gap: 8px;
  justify-content: center;
}

.message {
  padding: 12px 15px;
  border: 1px solid var(--border);
  background: var(--panel);
  border-radius: 14px;
  white-space: pre-wrap;
  overflow-wrap: anywhere;
}

.message.user {
  background: #292447;
  align-self: flex-end;
  max-width: 90%;
}

.message.assistant {
  align-self: flex-start;
  max-width: 95%;
}

.composer-area {
  padding: 12px;
}

.composer {
  max-width: 760px;
  margin: auto;
  display: flex;
  gap: 8px;
  align-items: flex-end;
  background: var(--panel);
  border: 1px solid var(--border);
  border-radius: 15px;
  padding: 10px;
}

.composer textarea {
  flex: 1;
  min-width: 0;
  max-height: 150px;
  resize: none;
  border: none;
  outline: none;
  background: transparent;
  color: var(--text);
  padding: 8px;
}

.send {
  background: var(--accent);
  color: white;
}

.footnote {
  text-align: center;
  font-size: 11px;
  margin-top: 8px;
}

/* Mobile sidebar and its close button */
@media (max-width: 700px) {
  .sidebar {
    position: fixed;
    z-index: 10;
    inset: 0 auto 0 0;
    width: min(85vw, 300px);
    height: 100dvh;
    overflow-y: auto;
    transform: translateX(-105%);
    transition: transform 0.2s ease;
  }

  .sidebar.open {
    transform: translateX(0);
    box-shadow: 0 0 0 100vmax #0008;
  }

  .close-sidebar {
    display: block;
  }

  .menu-button {
    display: inline-block;
  }

  .topbar {
    padding: 0 10px;
  }

  .welcome {
    padding: 20px 3px;
  }
}

/* Light theme */
body.light {
  --bg: #f6f7fb;
  --panel: #ffffff;
  --panel2: #edf0f6;
  --text: #171923;
  --muted: #626b7b;
  --border: #dce1eb;
}
</style>
</head>

<body>
<div class="app">

  <aside class="sidebar" id="sidebar">

    <div class="brand">
      <div class="logo">G</div>
      <span>Gozie AI</span>

      <!-- Tap this X to close the sidebar -->
      <button
        class="close-sidebar"
        id="closeSidebar"
        aria-label="Close sidebar"
        title="Close sidebar">×</button>
    </div>

    <button class="new-chat" id="newChat">＋ New chat</button>

    <div class="section-label">Your conversations</div>
    <div class="history" id="history"></div>

    <div class="settings">
      <div>
        <label for="theme">Appearance</label>
        <select id="theme">
          <option value="dark">Dark</option>
          <option value="light">Light</option>
        </select>
      </div>

      <div>
        <label for="accent">Accent colour</label>
        <input id="accent" type="color" value="#7c5cff">
      </div>

      <button id="signIn">Sign in</button>
      <button id="clearHistory">Clear chat history</button>
    </div>

  </aside>

  <main class="main">

    <header class="topbar">
      <div style="display:flex;align-items:center;gap:10px">
        <button class="menu-button" id="menuButton">☰</button>
        <strong id="chatTitle">New chat</strong>
      </div>

      <div class="top-actions">
        <button id="themeButton">◐</button>
        <button id="aboutButton">About</button>
      </div>
    </header>

    <section class="messages" id="messages">
      <div class="thread" id="thread">
        <div class="welcome">
          <h1>What can I help you with?</h1>
          <p>Welcome to Gozie AI, your personal AI assistant.</p>
          <div class="suggestions">
            <button>Explain something simply</button>
            <button>Help me write</button>
            <button>Brainstorm ideas</button>
          </div>
        </div>
      </div>
    </section>

    <div class="composer-area">
      <form class="composer" id="composer">
        <textarea
          id="prompt"
          rows="1"
          placeholder="Message Gozie AI…"
          aria-label="Message Gozie AI"></textarea>
        <button class="send" type="submit">↑ Send</button>
      </form>

      <div class="footnote" id="status">
        Preview mode · AI connection not yet configured
      </div>
    </div>

  </main>
</div>

<script>
const $ = id => document.getElementById(id);

let chats = [];
try {
  chats = JSON.parse(
    localStorage.getItem("gozie_chats_v1") || "[]"
  );
  if (!Array.isArray(chats)) chats = [];
} catch {
  chats = [];
}

let currentId = null;

function save() {
  try {
    localStorage.setItem("gozie_chats_v1", JSON.stringify(chats));
  } catch {}
  renderHistory();
}

function currentChat() {
  return chats.find(chat => chat.id === currentId);
}

function closeSidebar() {
  $("sidebar").classList.remove("open");
}

function newChat() {
  const chat = {
    id: Date.now().toString() +
        Math.random().toString(16).slice(2),
    title: "New chat",
    messages: [],
    updated: Date.now()
  };

  chats.unshift(chat);
  currentId = chat.id;
  save();
  renderChat();
  closeSidebar();
  $("prompt").focus();
}

function renderHistory() {
  const root = $("history");
  root.innerHTML = "";

  [...chats]
    .sort((a, b) => b.updated - a.updated)
    .forEach(chat => {
      const button = document.createElement("button");

      button.textContent = chat.title || "New chat";
      button.className =
        chat.id === currentId ? "active" : "";

      button.onclick = () => {
        currentId = chat.id;
        renderChat();
        closeSidebar();
      };

      root.appendChild(button);
    });
}

function addMessage(role, content) {
  const chat = currentChat();
  if (!chat) return;

  chat.messages.push({ role, content });
  chat.updated = Date.now();

  if (chat.title === "New chat" && role === "user") {
    chat.title = content.slice(0, 35) +
      (content.length > 35 ? "…" : "");
  }

  save();
  renderChat();
}

function renderChat() {
  const chat = currentChat();
  const thread = $("thread");

  $("chatTitle").textContent =
    chat ? chat.title : "New chat";

  thread.innerHTML = "";

  if (!chat || chat.messages.length === 0) {
    const welcome = document.createElement("div");
    welcome.className = "welcome";

    const heading = document.createElement("h1");
    heading.textContent = "What can I help you with?";

    const description = document.createElement("p");
    description.textContent =
      "Welcome to Gozie AI, your personal AI assistant.";

    const suggestions = document.createElement("div");
    suggestions.className = "suggestions";

    [
      "Explain something simply",
      "Help me write",
      "Brainstorm ideas"
    ].forEach(text => {
      const button = document.createElement("button");
      button.textContent = text;
      button.onclick = () => {
        $("prompt").value = text;
        $("prompt").focus();
      };
      suggestions.appendChild(button);
    });

    welcome.append(heading, description, suggestions);
    thread.appendChild(welcome);
  } else {
    chat.messages.forEach(message => {
      const bubble = document.createElement("div");
      bubble.className =
        "message " +
        (message.role === "user" ? "user" : "assistant");
      bubble.textContent = message.content;
      thread.appendChild(bubble);
    });
  }

  $("messages").scrollTop = $("messages").scrollHeight;
  renderHistory();
}

/* Sidebar controls */
$("menuButton").onclick = () => {
  $("sidebar").classList.toggle("open");
};

$("closeSidebar").onclick = closeSidebar;
$("newChat").onclick = newChat;

/* Chat form: placeholder responses until AI is connected */
$("composer").addEventListener("submit", event => {
  event.preventDefault();

  const text = $("prompt").value.trim();
  if (!text) return;

  if (!currentId) newChat();

  $("prompt").value = "";
  addMessage("user", text);

  addMessage(
    "assistant",
    "Gozie AI is not connected to the real AI model yet. " +
    "This is a preview. The next step is connecting " +
    "your SmolLM3 service securely."
  );

  $("status").textContent =
    "Preview mode · real AI connection is not configured";
});

$("prompt").addEventListener("keydown", event => {
  if (event.key === "Enter" && !event.shiftKey) {
    event.preventDefault();
    $("composer").requestSubmit();
  }
});

$("prompt").addEventListener("input", () => {
  const input = $("prompt");
  input.style.height = "auto";
  input.style.height = Math.min(input.scrollHeight, 150) + "px";
});

/* Theme settings */
function setTheme(theme) {
  document.body.classList.toggle("light", theme === "light");
  $("theme").value = theme;
  localStorage.setItem("gozie_theme_v1", theme);
}

$("theme").onchange = () => setTheme($("theme").value);

$("themeButton").onclick = () => {
  setTheme(
    document.body.classList.contains("light") ? "dark" : "light"
  );
};

$("accent").oninput = () => {
  document.documentElement.style.setProperty(
    "--accent",
    $("accent").value
  );
  localStorage.setItem("gozie_accent_v1", $("accent").value);
};

/* Other controls */
$("clearHistory").onclick = () => {
  if (confirm("Delete all conversations saved on this device?")) {
    chats = [];
    currentId = null;
    save();
    renderChat();
  }
};

$("signIn").onclick = () => {
  alert(
    "Google and email sign-in have not been configured yet. " +
    "We will add Firebase Authentication in the next stage."
  );
};

$("aboutButton").onclick = () => {
  alert(
    "Gozie AI interface prototype. " +
    "Real AI responses and sign-in are not connected yet."
  );
};

/* Restore saved preferences and conversations */
setTheme(localStorage.getItem("gozie_theme_v1") || "dark");

const savedAccent =
  localStorage.getItem("gozie_accent_v1") || "#7c5cff";

$("accent").value = savedAccent;
document.documentElement.style.setProperty(
  "--accent",
  savedAccent
);

if (chats.length > 0) {
  currentId = chats[0].id;
}

renderChat();
</script>
</body>
</html>
